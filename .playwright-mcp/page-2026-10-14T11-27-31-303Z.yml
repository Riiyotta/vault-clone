        - heading "Умови використання" [level=1] [ref=f80e25]
        - paragraph [ref=f80e26]:
          - strong [ref=f80e27]: Vault AI
          - text: "Дата набрання чинності: 12 жовтня 2026 р."
        - separator [ref=f80e28]
        - heading "1. Про ці Умови" [level=2] [ref=f80e29]
        - paragraph [ref=f80e30]:
          - text: Ці Умови використання («Умови») становлять юридично обов'язковий договір між вами та
          - strong [ref=f80e31]: Overcode Limited
          - text: ", компанією, зареєстрованою в Англії та Уельсі за номером 14697980, із зареєстрованим офісом за адресою Fifth Floor, 167-169 Great Portland Street, London, W1W 5PF, United Kingdom («Overcode», «ми», «нас»)."
        - paragraph [ref=f80e32]:
          - text: Ми керуємо
          - strong [ref=f80e33]: Vault AI
          - text: («Vault», «Сервіс») — платформою фінансового менеджменту та планування, доступною за адресою usevault.ai.
        - paragraph [ref=f80e34]: Створюючи обліковий запис, отримуючи доступ до Сервісу або приймаючи запрошення приєднатися до воркспейсу, ви погоджуєтеся з цими Умовами. Якщо ви не погоджуєтеся, не використовуйте Сервіс.
        - paragraph [ref=f80e35]:
          - text: Ці Умови включають шляхом посилання нашу
          - strong [ref=f80e36]:
            - link "Політику конфіденційності" [ref=f80e37] [cursor=pointer]:
              - /url: /ua/privacy
          - text: та нашу
          - strong [ref=f80e38]:
            - link "Угоду про обробку даних" [ref=f80e39] [cursor=pointer]:
              - /url: /ua/dpa
          - text: ", обидві з яких доступні за адресою usevault.ai."
        - separator [ref=f80e40]
        - heading "2. Визначення" [level=2] [ref=f80e41]
        - paragraph [ref=f80e42]:
          - strong [ref=f80e43]: Воркспейс
          - text: — окреме середовище в межах Сервісу, що представляє окремий бізнес і містить його рахунки, транзакції, звіти та учасників.
        - paragraph [ref=f80e44]:
          - strong [ref=f80e45]: Замовник
          - text: — юридична особа або зареєстрований фізичний підприємець, від імені якого створено воркспейс. Замовник є нашою договірною стороною.
        - paragraph [ref=f80e46]:
          - strong [ref=f80e47]: Власник
          - text: — фізична особа, яка створює воркспейс і уповноважена діяти від імені Замовника.
        - paragraph [ref=f80e48]:
          - strong [ref=f80e49]: Учасник
          - text: — будь-яка фізична особа, якій надано доступ до воркспейсу.
        - paragraph [ref=f80e50]:
          - strong [ref=f80e51]: Місце
          - text: — платне право доступу, що дозволяє одному Учаснику отримати доступ до воркспейсу.
        - paragraph [ref=f80e52]:
          - strong [ref=f80e53]: Дані Замовника
          - text: — усі дані, надані до Сервісу або імпортовані до нього Замовником чи від його імені, включно з транзакціями, залишками, реквізитами рахунків, категоріями та користувацькими атрибутами.
        - separator [ref=f80e54]
        - heading "3. Право на використання" [level=2] [ref=f80e55]
        - paragraph [ref=f80e56]:
          - strong [ref=f80e57]: 3.1 Лише для бізнесу.
          - text: Сервіс надається виключно суб'єктам господарювання. Ви можете використовувати Сервіс лише якщо ви є юридичною особою або зареєстрованим фізичним підприємцем, що діє в межах господарської діяльності. Сервіс не пропонується споживачам, і ви не можете використовувати його для особистих, сімейних або побутових цілей.
        - paragraph [ref=f80e58]:
          - strong [ref=f80e59]: 3.2 Повноваження.
          - text: Створюючи воркспейс, ви підтверджуєте, що вам виповнилося щонайменше 18 років і що ви уповноважені укласти ці Умови від імені Замовника.
        - paragraph [ref=f80e60]:
          - strong [ref=f80e61]: 3.3 Обмежені юрисдикції.
          - text: Сервіс недоступний особам або організаціям, які розташовані в будь-якій юрисдикції, що підпадає під всеосяжні санкції, запроваджені Сполученим Королівством, Європейським Союзом або Сполученими Штатами, створені за законодавством такої юрисдикції або постійно перебувають у ній, а також будь-якій особі чи організації, зазначеній у будь-якому санкційному переліку, що ведеться зазначеними органами. Станом на дату набрання чинності цими Умовами це включає, зокрема, Росію, Білорусь, Іран, Північну Корею, Сирію та окуповані території України. Ви підтверджуєте, що на вас не поширюються такі заходи, і зобов'язуєтеся негайно повідомити нас, якщо це зміниться.
        - separator [ref=f80e62]
        - heading "4. Облікові записи та воркспейси" [level=2] [ref=f80e63]
        - paragraph [ref=f80e64]:
          - strong [ref=f80e65]: 4.1 Безпека облікового запису.
          - text: Ви несете відповідальність за збереження конфіденційності доступу до свого облікового запису та за всі дії, що здійснюються під ним. Ви зобов'язані невідкладно повідомити нас на
          - link "hello@usevault.ai" [ref=f80e66] [cursor=pointer]:
            - /url: mailto:hello@usevault.ai
          - text: ", якщо вам стане відомо про будь-який несанкціонований доступ."
        - paragraph [ref=f80e67]:
          - strong [ref=f80e68]: 4.2 Учасники та дозволи.
          - text: Власник і будь-який Учасник, якому надано права управління користувачами, можуть запрошувати інших Учасників та налаштовувати їхні дозволи. Замовник несе відповідальність за дії та бездіяльність усіх своїх Учасників, а також за забезпечення того, щоб дозволи, надані в межах воркспейсу, залишалися належними.
        - paragraph [ref=f80e69]:
          - strong [ref=f80e70]: 4.3 Достовірність.
          - text: Ви зобов'язані надавати достовірну реєстраційну інформацію та підтримувати її в актуальному стані.
        - separator [ref=f80e71]
        - heading "5. Тарифи, Місця та Оплата" [level=2] [ref=f80e72]
        - paragraph [ref=f80e73]:
          - strong [ref=f80e74]: 5.1 Тарифи.
          - text: "Сервіс пропонується за такими тарифами:"
        - generic [ref=f80e76]:
          - generic [ref=f80e77]:
            - paragraph [ref=f80e78]:
              - strong [ref=f80e79]: Free
            - generic [ref=f80e80]:
              - generic [ref=f80e81]:
                - term [ref=f80e82]: Ціна
                - definition [ref=f80e83]: безкоштовно, для команд до 3 осіб
              - generic [ref=f80e84]:
                - term [ref=f80e85]: Транзакцій / місяць
                - definition [ref=f80e86]: "200"
              - generic [ref=f80e87]:
                - term [ref=f80e88]: Банківські рахунки
                - definition [ref=f80e89]: немає — лише ручне введення та імпорт
          - generic [ref=f80e90]:
            - paragraph [ref=f80e91]:
              - strong [ref=f80e92]: Basic
            - generic [ref=f80e93]:
              - generic [ref=f80e94]:
                - term [ref=f80e95]: Ціна
                - definition [ref=f80e96]: $30 за Місце / місяць або $25 за Місце / місяць при річній оплаті
              - generic [ref=f80e97]:
                - term [ref=f80e98]: Транзакцій / місяць
                - definition [ref=f80e99]: "800"
              - generic [ref=f80e100]:
                - term [ref=f80e101]: Банківські рахунки
                - definition [ref=f80e102]: "2"
          - generic [ref=f80e103]:
            - paragraph [ref=f80e104]:
              - strong [ref=f80e105]: Pro
            - generic [ref=f80e106]:
              - generic [ref=f80e107]:
                - term [ref=f80e108]: Ціна
                - definition [ref=f80e109]: $50 за Місце / місяць або $42 за Місце / місяць при річній оплаті
              - generic [ref=f80e110]:
                - term [ref=f80e111]: Транзакцій / місяць
                - definition [ref=f80e112]: 1,500
              - generic [ref=f80e113]:
                - term [ref=f80e114]: Банківські рахунки
                - definition [ref=f80e115]: "10"
          - generic [ref=f80e116]:
            - paragraph [ref=f80e117]:
              - strong [ref=f80e118]: Enterprise
            - generic [ref=f80e119]:
              - generic [ref=f80e120]:
                - term [ref=f80e121]: Ціна
                - definition [ref=f80e122]: за запитом
              - generic [ref=f80e123]:
                - term [ref=f80e124]: Транзакцій / місяць
                - definition [ref=f80e125]: узгоджується індивідуально
              - generic [ref=f80e126]:
                - term [ref=f80e127]: Банківські рахунки
                - definition [ref=f80e128]: узгоджується індивідуально
        - paragraph [ref=f80e129]: Тариф Free підтримує лише ручні рахунки та імпортовані дані; банківські підключення потребують платного тарифу. Basic додає налаштовувані дозволи учасників, а також звіти Payment Calendar і Cashflow. Pro додає підключення криптогаманців, звіт P&L і користувацькі звіти. Enterprise додає частіше оновлення залишків і пріоритетну підтримку на умовах, погоджених у письмовій формі.
        - paragraph [ref=f80e130]: Функції та ціни тарифів можуть оновлюватися відповідно до пункту 15.
        - paragraph [ref=f80e131]:
          - strong [ref=f80e132]: 5.1a Ліміти тарифів.
          - text: Кожен тариф має місячний ліміт транзакцій, який рахується за календарний місяць. Ми повідомлятимемо вас у Сервісі, коли воркспейс наближається до цього ліміту та досягає його, і можемо запропонувати тариф, що відповідає його використанню. Якщо воркспейс перевищить ліміт, ми не припинятимемо синхронізацію його рахунків, не блокуватимемо нові транзакції та не видалятимемо дані через це перевищення.
        - paragraph [ref=f80e133]: Якщо воркспейс досяг ліміту банківських рахунків свого тарифу, подальші банківські рахунки не можуть бути підключені, доки не буде видалено наявне підключення або воркспейс не перейде на вищий тариф.
        - paragraph [ref=f80e134]:
          - strong [ref=f80e135]: 5.2 Безкоштовний пробний період.
          - text: Кожен новий воркспейс отримує безкоштовний пробний період тарифу Pro тривалістю один місяць. Для початку пробного періоду платіжна картка не потрібна. До завершення пробного періоду Замовник може залишитися на тарифі Pro або обрати інший тариф; для продовження користування платним тарифом потрібні платіжні дані. Якщо до завершення пробного періоду не оформлено платну підписку, воркспейс повертається до безкоштовного тарифу. Ми можемо обмежити кількість безкоштовних пробних періодів одним на Замовника.
        - paragraph [ref=f80e136]:
          - strong [ref=f80e137]: 5.3 Місця.
          - text: Вартість платних тарифів розраховується за кожне Місце. Ви купуєте кількість Місць, а не кількість поіменно визначених осіб. Ви можете призначати та перепризначати Місця між Учасниками в будь-який час.
          - strong [ref=f80e138]: Плата нараховується виходячи з кількості придбаних Місць незалежно від того, чи всі вони призначені.
          - text: Зменшення кількості Учасників не зменшує вашу плату за решту оплаченого періоду.
        - paragraph [ref=f80e139]:
          - strong [ref=f80e140]: 5.4 Додавання Місць.
          - text: Місця, додані протягом розрахункового періоду, тарифікуються пропорційно за решту цього періоду.
        - paragraph [ref=f80e141]:
          - strong [ref=f80e142]: 5.5 Виставлення інвойсів.
          - text: Підписки можуть оплачуватися щомісяця або щорічно авансом. Річні підписки оплачуються в повному обсязі на початку річного періоду. Оплата здійснюється карткою через нашого платіжного провайдера Stripe або банківським переказом на підставі інвойсу, якщо ми погодили такий спосіб.
        - paragraph [ref=f80e143]:
          - strong [ref=f80e144]: 5.6 Валюта.
          - text: Ціни зазначаються та стягуються в доларах США, якщо ми прямо не погодили інше в письмовій формі. Якщо ми погоджуємося виставити інвойс в іншій валюті, конвертація здійснюється за курсом, що діє на дату інвойсу.
        - paragraph [ref=f80e145]:
          - strong [ref=f80e146]: 5.7 Податки.
          - text: Ціни не включають податки. Ви несете відповідальність за будь-який податок на додану вартість, податок на товари та послуги, податок з продажу, податок на репатріацію доходів або подібний збір, що виникає у вашій юрисдикції. Якщо застосовується механізм зворотного нарахування, ви несете відповідальність за облік відповідного податку.
        - paragraph [ref=f80e147]:
          - strong [ref=f80e148]: 5.8 Без повернення коштів.
          - strong [ref=f80e149]: Усі платежі не підлягають поверненню
          - text: ", за винятком випадків, коли повернення вимагається чинним законодавством. Це включає, зокрема, невикористані Місця, невикористані частини періоду підписки та періоди, протягом яких ви вирішили не користуватися Сервісом."
        - paragraph [ref=f80e150]:
          - strong [ref=f80e151]: 5.9 Невдалий платіж.
          - text: Якщо платіж не проходить, ми спробуємо списати кошти повторно відповідно до стандартного процесу повторних спроб нашого платіжного провайдера. Якщо після цих спроб платіж не буде отримано, ми можемо призупинити або припинити платні функції, включно з банківськими інтеграціями та інтеграціями гаманців і доступом до Сервісу, без додаткового повідомлення. Дані зберігаються та видаляються відповідно до пункту 12.
        - paragraph [ref=f80e152]:
          - strong [ref=f80e153]: 5.10 Зміни цін.
          - text: Ми можемо змінювати наші ціни. Зміни набирають чинності з початку вашого наступного розрахункового періоду, і ми повідомимо вас щонайменше за 30 днів.
        - separator [ref=f80e154]
        - heading "6. Чим Сервіс Є і Чим Він Не Є" [level=2] [ref=f80e155]
        - paragraph [ref=f80e156]:
          - strong [ref=f80e157]: Цей пункт є важливим. Будь ласка, прочитайте його уважно.
        - paragraph [ref=f80e158]:
          - strong [ref=f80e159]: 6.1 Призначення.
          - text: Vault імпортує, впорядковує та відображає фінансову інформацію, щоб ви могли бачити та планувати фінанси свого бізнесу. Він надає інструменти візуалізації, категоризації, звітності та планування.
        - paragraph [ref=f80e160]:
          - strong [ref=f80e161]: 6.2 Не бухгалтерський облік, не податки і не консультації.
          - text: Сервіс
          - strong [ref=f80e162]: не
          - text: є системою бухгалтерського обліку, системою ведення обліку, інструментом подання податкової звітності або джерелом фінансових, інвестиційних, юридичних чи податкових консультацій. Показники, представлені в Сервісі, мають інформаційний характер. Вони не є і не повинні використовуватися як офіційна фінансова звітність, податкові документи або аудійована фінансова звітність.
        - paragraph [ref=f80e163]:
          - strong [ref=f80e164]: 6.3 Перевірка є вашим обов'язком.
          - text: Ви несете відповідальність за перевірку всіх показників за вашими першоджерелами — банківськими виписками, обліковими записами та іншими авторитетними документами — перш ніж покладатися на них для будь-яких цілей.
          - strong [ref=f80e165]: Ми не гарантуємо, що показники, представлені в Сервісі, є повними, точними або актуальними.
        - paragraph [ref=f80e166]:
          - strong [ref=f80e167]: 6.4 Рішення є вашими.
          - text: Будь-яке ділове, фінансове або комерційне рішення, яке ви приймаєте, є виключно вашим. Ми не несемо відповідальності за наслідки рішень, прийнятих із опорою на інформацію, представлену Сервісом.
        - paragraph [ref=f80e168]:
          - strong [ref=f80e169]: 6.5 Професійні консультації.
          - text: Вам слід звернутися до кваліфікованого бухгалтера, аудитора або податкового консультанта щодо ваших зобов'язань з обліку, звітності та оподаткування.
        - separator [ref=f80e170]
        - heading "7. Банківські підключення, Гаманці та Дані Третіх Сторін" [level=2] [ref=f80e171]
        - paragraph [ref=f80e172]:
          - strong [ref=f80e173]: 7.1 Доступ лише для читання.
          - text: Коли ви підключаєте банківський рахунок, Vault отримує доступ
          - strong [ref=f80e174]: лише для читання
          - text: до інформації про рахунок і транзакції через ліцензованого провайдера open banking.
          - strong [ref=f80e175]: Vault за жодних обставин не може ініціювати платежі, переміщувати кошти або вносити будь-які зміни до вашого банківського рахунку.
        - paragraph [ref=f80e176]:
          - strong [ref=f80e177]: 7.2 Ваша згода.
          - text: Банківські підключення потребують вашої прямої згоди, наданої безпосередньо провайдеру open banking і вашому банку. Згоди надаються на обмежений строк і можуть потребувати періодичного поновлення. Якщо строк дії згоди закінчується або її відкликано, оновлення даних припиняється до її поновлення.
        - paragraph [ref=f80e178]:
          - strong [ref=f80e179]: 7.3 Криптогаманці.
          - text: Коли ви додаєте адресу блокчейн-гаманця, Vault зчитує загальнодоступні дані про транзакції, пов'язані з цією адресою. Vault не зберігає приватних ключів і не може переміщувати, витрачати або іншим чином контролювати будь-які активи.
        - paragraph [ref=f80e180]:
          - strong [ref=f80e181]: 7.4 Дані третіх сторін.
          - text: Дані про рахунки, залишки та транзакції походять від вашого банку, платіжного провайдера або публічного блокчейну. Ми передаємо та відображаємо їх, не змінюючи їхньої фінансової суті.
          - strong [ref=f80e182]: Ми не несемо відповідальності за точність, повноту, своєчасність або доступність даних, наданих третіми сторонами
          - text: ", а також за перерви, затримки, помилки чи збої, що виникають у банку, провайдера open banking, блокчейн-мережі або будь-якої іншої третьої сторони."
        - paragraph [ref=f80e183]:
          - strong [ref=f80e184]: 7.5 Покриття.
          - text: Банки та установи, доступні для підключення, залежать від покриття наших провайдерів і можуть змінюватися. Ми не гарантуємо, що будь-яка конкретна установа є або залишатиметься доступною.
        - separator [ref=f80e185]
        - heading "8. Ваші Обов'язки та Прийнятне Використання" [level=2] [ref=f80e186]
        - paragraph [ref=f80e187]:
          - strong [ref=f80e188]: 8.1 Правомірність даних.
          - text: Ви повинні мати право надавати всі Дані Замовника до Сервісу. Якщо Дані Замовника містять персональні дані третіх осіб — таких як контрагенти, працівники або підрядники — ви несете відповідальність за наявність правової підстави для їх обробки та за надання будь-яких необхідних повідомлень.
        - paragraph [ref=f80e189]:
          - strong [ref=f80e190]: 8.2 Заборонені дії.
          - text: "Ви не повинні і не повинні дозволяти будь-якому Учаснику чи третій стороні:"
        - list [ref=f80e191]:
          - listitem [ref=f80e192]: перепродавати, субліцензувати, здавати в оренду або іншим чином надавати Сервіс будь-якій третій стороні, яка не є Учасником вашого воркспейсу;
          - listitem [ref=f80e193]: здійснювати зворотну розробку, декомпіляцію чи дизасемблювання будь-якої частини Сервісу або намагатися отримати його вихідний код, за винятком випадків, коли таке обмеження заборонене чинним законодавством;
          - listitem [ref=f80e194]: здійснювати скрейпінг, сканування або використовувати автоматизовані засоби для вилучення даних із Сервісу, інакше ніж через надану нами функціональність;
          - listitem [ref=f80e195]: обходити або намагатися обійти будь-який контроль доступу, дозвіл, обмеження частоти запитів чи обмеження використання;
          - listitem [ref=f80e196]: завантажувати дані, на обробку яких ви не маєте права, або дані, які є незаконними, шкідливими чи такими, що порушують права;
          - listitem [ref=f80e197]: використовувати Сервіс для розробки конкурентного продукту або для бенчмаркінгу, оприлюдненого без нашої письмової згоди;
          - listitem [ref=f80e198]: втручатися в цілісність, безпеку або продуктивність Сервісу.
        - paragraph [ref=f80e199]:
          - strong [ref=f80e200]: 8.3 Наслідки.
          - text: Ми можемо негайно призупинити доступ, якщо обґрунтовано вважаємо, що цей пункт було порушено, або якщо подальший доступ становить ризик для Сервісу чи для інших замовників.
        - separator [ref=f80e201]
        - heading "9. Захист даних" [level=2] [ref=f80e202]
        - paragraph [ref=f80e203]:
          - strong [ref=f80e204]: "9.1"
          - text: Наше поводження з персональними даними описано в нашій
          - strong [ref=f80e205]:
            - link "Політиці конфіденційності" [ref=f80e206] [cursor=pointer]:
              - /url: /ua/privacy
          - text: .
        - paragraph [ref=f80e207]:
          - strong [ref=f80e208]: "9.2"
          - text: Коли ми обробляємо персональні дані, що містяться в Даних Замовника, від вашого імені, ми діємо як обробник, а ви дієте як контролер. Така обробка регулюється нашою
          - strong [ref=f80e209]:
            - link "Угодою про обробку даних" [ref=f80e210] [cursor=pointer]:
              - /url: /ua/dpa
          - text: ", яка є частиною цих Умов."
        - paragraph [ref=f80e211]:
          - strong [ref=f80e212]: "9.3"
          - text: Кожна сторона дотримуватиметься чинного законодавства про захист даних щодо власної обробки.
        - separator [ref=f80e213]
        - heading "10. Доступність та Підтримка" [level=2] [ref=f80e214]
        - paragraph [ref=f80e215]:
          - strong [ref=f80e216]: 10.1 Без зобов'язань щодо безперебійності.
          - text: Ми прагнемо забезпечити доступність та належну роботу Сервісу, проте
          - strong [ref=f80e217]: ми не гарантуємо жодного конкретного рівня доступності, безперебійності роботи або продуктивності
          - text: і не надаємо жодних сервісних компенсацій. Сервіс надається на умовах «як доступно».
        - paragraph [ref=f80e218]:
          - strong [ref=f80e219]: 10.2 Технічне обслуговування.
          - text: Ми можемо проводити технічне обслуговування, яке тимчасово впливає на доступність. Якщо обслуговування є плановим, ми повідомимо щонайменше за 24 години електронною поштою або сповіщенням у застосунку. Аварійне обслуговування може проводитися без попередження.
        - paragraph [ref=f80e220]:
          - strong [ref=f80e221]: 10.3 Підтримка.
          - text: Підтримка надається електронною поштою на
          - link "hello@usevault.ai" [ref=f80e222] [cursor=pointer]:
            - /url: mailto:hello@usevault.ai
          - text: та через чат у застосунку. Ми прагнемо відповідати оперативно в робочі години, проте не зобов'язуємося дотримуватися конкретного часу відповіді.
        - separator [ref=f80e223]
        - heading "11. Інтелектуальна власність" [level=2] [ref=f80e224]
        - paragraph [ref=f80e225]:
          - strong [ref=f80e226]: 11.1 Наші права.
          - text: Сервіс, включно з усім програмним забезпеченням, дизайном, текстами, графікою та документацією, належить Overcode або її ліцензіарам і охороняється законодавством про інтелектуальну власність. Ці Умови надають вам обмежене, невиключне, непередаване, відкличне право користуватися Сервісом протягом строку вашої підписки і нічого більше.
        - paragraph [ref=f80e227]:
          - strong [ref=f80e228]: 11.2 Ваші дані.
          - text: Ви зберігаєте всі права на Дані Замовника. Ви надаєте нам обмежену ліцензію на розміщення, обробку, передавання та відображення Даних Замовника виключно для надання та підтримки Сервісу, а також у межах, необхідних для дотримання законодавства.
        - paragraph [ref=f80e229]:
          - strong [ref=f80e230]: 11.3 Зворотний зв'язок.
          - text: Якщо ви надаєте нам пропозиції або зворотний зв'язок, ми можемо використовувати їх без обмежень і без зобов'язань перед вами.
        - separator [ref=f80e231]
        - heading "12. Призупинення, Припинення, Експорт та Видалення" [level=2] [ref=f80e232]
        - paragraph [ref=f80e233]:
          - strong [ref=f80e234]: 12.1 Ваше право припинити.
          - text: Ви можете скасувати підписку в будь-який час. Скасування набирає чинності наприкінці поточного розрахункового періоду. Відповідно до пункту 5.8, повернення коштів за решту цього періоду не здійснюється.
        - paragraph [ref=f80e235]:
          - strong [ref=f80e236]: 12.2 Наше право припинити.
          - text: "Ми можемо призупинити або припинити ваш доступ:"
        - list [ref=f80e237]:
          - listitem [ref=f80e238]: за несплату, відповідно до пункту 5.9;
          - listitem [ref=f80e239]: негайно, за порушення пункту 3.3 (санкції) або пункту 8 (прийнятне використання);
          - listitem [ref=f80e240]: за будь-яке інше істотне порушення, не усунене протягом 14 днів з моменту письмового повідомлення;
          - listitem [ref=f80e241]: з повідомленням за 30 днів, якщо ми припиняємо надання Сервісу.
        - paragraph [ref=f80e242]:
          - strong [ref=f80e243]: 12.3 Експорт.
          - text: Ви можете експортувати свої транзакції із Сервісу у форматі CSV у будь-який час, поки ваш воркспейс існує.
        - paragraph [ref=f80e244]:
          - strong [ref=f80e245]: 12.4 Видалення.
          - text: "Скасування платної підписки не видаляє жодних даних: воркспейс переходить на тариф Free, а його Дані Замовника залишаються доступними. У разі видалення воркспейсу всі Дані Замовника в ньому негайно й остаточно видаляються з наших робочих систем, а будь-які підключення банківських рахунків і гаманців відкликаються."
          - strong [ref=f80e246]: Період відновлення не передбачено
          - text: ", тому вам слід експортувати всі потрібні дані до видалення воркспейсу. Залишкові копії можуть зберігатися в зашифрованих резервних копіях бази даних до"
          - strong [ref=f80e247]: 7 днів
          - text: ", а в системних журналах і звітах про помилки — до"
          - strong [ref=f80e248]: 30 днів
          - text: ", після чого вони перезаписуються."
        - paragraph [ref=f80e249]:
          - strong [ref=f80e250]: 12.5 Резервні копії.
          - text: Дані, вилучені з робочих систем, зберігаються в зашифрованих резервних копіях до
          - strong [ref=f80e251]: 7 днів
          - text: ", після чого ці резервні копії втрачають чинність і дані стають невідновлюваними."
        - paragraph [ref=f80e252]:
          - strong [ref=f80e253]: 12.6 Профілі учасників.
          - text: Видалення воркспейсу видаляє воркспейс і Дані Замовника. Воно не видаляє особисті профілі користувачів Учасників, які є окремими та можуть бути пов'язані з іншими воркспейсами. Фізична особа може запитати видалення власного профілю, як описано в Політиці конфіденційності.
        - paragraph [ref=f80e254]:
          - strong [ref=f80e255]: 12.7 Документи, які ми зобов'язані зберігати.
          - text: Ми можемо зберігати інвойси, платіжні документи та подібні документи, якщо це необхідно для дотримання юридичних, бухгалтерських або податкових зобов'язань.
        - separator [ref=f80e256]
        - heading "13. Гарантії та Застереження" [level=2] [ref=f80e257]
        - paragraph [ref=f80e258]:
          - strong [ref=f80e259]: "13.1"
          - text: У максимальному обсязі, дозволеному законодавством, Сервіс надається
          - strong [ref=f80e260]: «як є» та «як доступно»
          - text: ", без будь-яких гарантій, прямих, непрямих або встановлених законом."
        - paragraph [ref=f80e261]:
          - strong [ref=f80e262]: "13.2"
          - text: Ми окремо відмовляємося від будь-яких непрямих гарантій товарної придатності, придатності для певної мети, відсутності порушення прав, точності, а також безперебійної або безпомилкової роботи.
        - paragraph [ref=f80e263]:
          - strong [ref=f80e264]: "13.3"
          - text: Ми не гарантуємо, що Сервіс відповідатиме вашим вимогам, що недоліки буде усунено або що будь-які представлені дані є точними, повними чи актуальними.
        - separator [ref=f80e265]
        - heading "14. Обмеження відповідальності" [level=2] [ref=f80e266]
        - paragraph [ref=f80e267]:
          - strong [ref=f80e268]: 14.1 Обмеження.
          - text: У максимальному обсязі, дозволеному законодавством, наша сукупна відповідальність, що виникає з цих Умов і Сервісу або у зв'язку з ними, чи то на підставі договору, делікту (включно з недбалістю), порушення встановленого законом обов'язку чи іншим чином,
          - strong [ref=f80e269]: не перевищуватиме загальної суми, сплаченої вами нам протягом дванадцяти (12) місяців, що безпосередньо передували події, яка стала підставою для вимоги
          - text: .
        - paragraph [ref=f80e270]:
          - strong [ref=f80e271]: 14.2 Виключені збитки.
          - text: "Ми не несемо відповідальності за будь-які:"
        - list [ref=f80e272]:
          - listitem [ref=f80e273]: втрату прибутку, доходу, бізнесу, договорів або очікуваних заощаджень;
          - listitem [ref=f80e274]: втрату, пошкодження або неточність даних, крім нашого обов'язку підтримувати резервні копії, як описано в пункті 12.5;
          - listitem [ref=f80e275]: втрату ділової репутації або репутаційну шкоду;
          - listitem [ref=f80e276]: непрямі, побічні, спеціальні або штрафні збитки;
          - listitem [ref=f80e277]: збитки, що виникають унаслідок рішень, прийнятих із опорою на інформацію, представлену Сервісом;
          - listitem [ref=f80e278]: збитки, що виникають унаслідок дій, бездіяльності, помилок, затримок або недоступності будь-якого банку, провайдера open banking, платіжного провайдера, блокчейн-мережі чи іншої третьої сторони.
        - paragraph [ref=f80e279]:
          - strong [ref=f80e280]: 14.3 Що не виключається.
          - text: Ніщо в цих Умовах не виключає та не обмежує відповідальність за смерть або тілесні ушкодження, спричинені недбалістю, за шахрайство чи шахрайське введення в оману, а також за будь-яку іншу відповідальність, яка не може бути правомірно виключена або обмежена.
        - paragraph [ref=f80e281]:
          - strong [ref=f80e282]: 14.4 Безкоштовний тариф і пробні періоди.
          - text: Якщо Сервіс надається безкоштовно, включно з безкоштовним тарифом і протягом безкоштовного пробного періоду, наша відповідальність обмежена у максимальному обсязі, дозволеному законодавством.
        - separator [ref=f80e283]
        - heading "15. Зміни до цих Умов" [level=2] [ref=f80e284]
        - paragraph [ref=f80e285]:
          - strong [ref=f80e286]: "15.1"
          - text: Ми можемо вносити зміни до цих Умов. Якщо зміна є істотною, ми повідомимо щонайменше за 30 днів електронною поштою Власнику воркспейсу або сповіщенням у застосунку.
        - paragraph [ref=f80e287]:
          - strong [ref=f80e288]: "15.2"
          - text: Продовження користування Сервісом після набрання зміною чинності означає її прийняття. Якщо ви не приймаєте зміну, ви можете припинити договір відповідно до пункту 12.1 до набрання нею чинності.
        - separator [ref=f80e289]
        - heading "16. Загальні положення" [level=2] [ref=f80e290]
        - paragraph [ref=f80e291]:
          - strong [ref=f80e292]: 16.1 Відступлення.
          - text: Ви не можете відступати або передавати ці Умови без нашої письмової згоди. Ми можемо відступити або передати ці Умови у зв'язку зі злиттям, придбанням, корпоративною реорганізацією або продажем активів.
        - paragraph [ref=f80e293]:
          - strong [ref=f80e294]: 16.2 Повнота домовленості.
          - text: Ці Умови разом із Політикою конфіденційності та Угодою про обробку даних становлять повну домовленість між сторонами щодо Сервісу і замінюють усі попередні обговорення та заяви.
        - paragraph [ref=f80e295]:
          - strong [ref=f80e296]: 16.3 Подільність.
          - text: Якщо будь-яке положення визнається таким, що не підлягає примусовому виконанню, решта положень залишаються чинними в повному обсязі.
        - paragraph [ref=f80e297]:
          - strong [ref=f80e298]: 16.4 Відсутність відмови від прав.
          - text: Невиконання будь-якого положення не є відмовою від нього.
        - paragraph [ref=f80e299]:
          - strong [ref=f80e300]: 16.5 Треті сторони.
